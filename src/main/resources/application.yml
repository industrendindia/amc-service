spring:
  application.name: amc-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/amcservice}
    username: ${DB_USERNAME:amcservice}
    password: ${DB_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
  flyway:
    schemas: amcservice
    default-schema: amcservice
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
management.endpoints.web.exposure.include: health,info
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production-12345}
  jwt-hours: 12
  notification-cron: ${NOTIFICATION_CRON:0 15 8 * * *}
  public-ui-url: ${PUBLIC_UI_URL:http://localhost:5173}
  meta:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    graph-version: ${META_GRAPH_VERSION:v23.0}
    callback-url: ${META_CALLBACK_URL:http://localhost:8080/api/social/facebook/callback}
    token-encryption-key: ${META_TOKEN_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 105MB
